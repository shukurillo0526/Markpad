<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Markpad Native v2.0 Showcase</title>
  <style>
    :root {
      --bg: #050508;
      --card: rgba(255, 255, 255, 0.05);
      --accent: #8b5cf6;
      --cyan: #06b6d4;
      --text: #f8fafc;
      --muted: #94a3b8;
    }
    body {
      margin: 0;
      padding: 40px 20px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 80vh;
    }
    .card {
      background: var(--card);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 40px;
      max-width: 580px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
      text-align: center;
    }
    h1 {
      font-size: 2.5rem;
      margin-bottom: 0.5rem;
      background: linear-gradient(135deg, #c084fc, #06b6d4);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    p { color: var(--muted); line-height: 1.6; font-size: 1.1rem; }
    .features { display: flex; justify-content: space-around; margin: 30px 0; }
    .feat { font-weight: 600; font-size: 0.95rem; }
    .badge {
      display: inline-block;
      padding: 8px 16px;
      border-radius: 30px;
      background: rgba(139, 92, 246, 0.15);
      border: 1px solid var(--accent);
      color: #c084fc;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="card">
    <span class="badge">Markpad Native v2.0</span>
    <h1>The VLC of Text Files</h1>
    <p>A blazing-fast, lightweight native editor built with Rust and Tauri v2. Open, parse, and format any document instantly.</p>
    <div class="features">
      <div class="feat">⚡ 100ms Startup</div>
      <div class="feat">🔒 100% Offline</div>
      <div class="feat">🌐 7 Languages</div>
    </div>
  </div>
</body>
</html>
