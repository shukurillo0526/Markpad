# Markpad Native v2.0 — GitHub Actions Release Pipeline
name: Release Markpad Native

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-bundle:
    runs-on: windows-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'v2/package-lock.json'

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install Frontend Dependencies
        working-directory: ./v2
        run: npm ci

      - name: Run Svelte & TypeScript Diagnostics
        working-directory: ./v2
        run: npm run check

      - name: Compile Tauri v2 Native Binary & Installer
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: ./v2
          tagName: ${{ github.ref_name }}
          releaseName: 'Markpad Native ${{ github.ref_name }}'
          releaseBody: 'The VLC of Text Files — High-Performance Native Utility'
          releaseDraft: false
          prerelease: false
