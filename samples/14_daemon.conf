# Markpad Native IPC & Daemon Configuration
daemon.enabled = true
daemon.named_pipe = "\\.\pipe\markpad-native"
daemon.buffer_size_kb = 256
daemon.timeout_ms = 5000

# Window Management Policy
windows.max_concurrent_instances = 1
windows.multi_window_enabled = true
windows.cross_window_drag_drop = true
windows.single_instance_forward_args = true

# Memory Management
memory.cache_limit_mb = 128
memory.stream_large_files = true
memory.gc_interval_sec = 60
