<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Markpad Native — Sample Web Page</title>
  <style>
    body {
      background-color: #0f172a;
      color: #f8fafc;
      font-family: system-ui, -apple-system, sans-serif;
      margin: 0;
      padding: 40px;
    }
    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 24px;
      max-width: 600px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
    }
    h1 { color: #38bdf8; font-size: 24px; margin-top: 0; }
    .badge { background: #38bdf8; color: #0f172a; padding: 4px 8px; border-radius: 4px; font-weight: bold; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Markpad Native <span class="badge">v2.0</span></h1>
    <p>Published by <strong>Vodiy</strong> — A blazing-fast native text utility built with Tauri v2, Rust, and Svelte 5.</p>
    <button onclick="alert('Hello from Markpad!')">Click Me</button>
  </div>
</body>
</html>
