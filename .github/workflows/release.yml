name: "Publish Release"

on:
  push:
    tags:
      - "v*"

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "windows-latest"
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./v2/src-tauri -> target"

      - name: Install dependencies
        run: |
          cd v2
          npm install

      - name: Build Svelte frontend
        run: |
          cd v2
          npm run build

      - name: Build Tauri native packages
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: markpad-v__VERSION__
          releaseName: "Markpad v__VERSION__"
          releaseBody: "Native high-performance Windows text editor rebuilt from scratch in Rust + Svelte."
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
          projectPath: "./v2"
